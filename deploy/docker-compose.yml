# Sable on your domain, for more than one person.
#
#   front.example.com  → Caddy (public, automatic HTTPS) → only a blank page + each person's webhooks
#   each Sable app     → private: 127.0.0.1 ports, reached through Tailscale (see docs/hosting-securely.md)
#
#   cd deploy && cp .env.example .env && $EDITOR .env Caddyfile && docker compose up -d
#
# Every person gets their own container, data volume, password, 2FA, Shop account and API keys.
# Nothing is shared between instances except the Ollama model server (which stores no chats).
name: sable

x-sable: &sable
  build: ..
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks: [internal]
  depends_on: [ollama]

x-runner: &runner
  build: ../runner
  restart: unless-stopped
  networks: [internal]
  tmpfs:
    - /tmp:size=512m
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  mem_limit: 2g
  cpus: 2
  pids_limit: 256

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      FRONT_DOMAIN: ${FRONT_DOMAIN}
      SLUG_A: ${SLUG_A}
      SLUG_B: ${SLUG_B}
      FRONT_TITLE: ${FRONT_TITLE}
    networks: [internal]

  sable-a:
    <<: *sable
    ports:
      - "127.0.0.1:8787:8787" # private app for person A
    volumes:
      - sable-a:/data
    environment:
      OLLAMA_HOST: http://ollama:11434
      SABLE_PUBLIC_PORT: "8788" # public front, only reachable through Caddy
      SABLE_PUBLIC_URL: https://${FRONT_DOMAIN}/${SLUG_A}
      SABLE_RUNNER_URL: http://runner-a:8790
      SABLE_RUNNER_TOKEN: ${RUNNER_TOKEN_A:-}
      SABLE_PUBLIC_TITLE: ${FRONT_TITLE}
      TZ: ${TZ}

  sable-b:
    <<: *sable
    ports:
      - "127.0.0.1:8789:8787" # private app for person B
    volumes:
      - sable-b:/data
    environment:
      OLLAMA_HOST: http://ollama:11434
      SABLE_PUBLIC_PORT: "8788"
      SABLE_PUBLIC_URL: https://${FRONT_DOMAIN}/${SLUG_B}
      SABLE_RUNNER_URL: http://runner-b:8790
      SABLE_RUNNER_TOKEN: ${RUNNER_TOKEN_B:-}
      SABLE_PUBLIC_TITLE: ${FRONT_TITLE}
      TZ: ${TZ}

  # Person A's script sandbox: sees only A's workspace (Docker Engine 26+ for subpath).
  runner-a:
    <<: *runner
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN_A:-}
      TZ: ${TZ}
    volumes:
      - type: volume
        source: sable-a
        target: /workspace
        volume:
          subpath: workspace

  # Person B's script sandbox: sees only B's workspace (Docker Engine 26+ for subpath).
  runner-b:
    <<: *runner
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN_B:-}
      TZ: ${TZ}
    volumes:
      - type: volume
        source: sable-b
        target: /workspace
        volume:
          subpath: workspace

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    # NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

networks:
  internal:

volumes:
  caddy-data:
  caddy-config:
  sable-a:
  sable-b:
  ollama:
