# Single private Sable + Ollama. For a public domain (and several people), see deploy/.
services:
  sable:
    build: .
    restart: unless-stopped
    ports:
      # Private app: only reachable from this machine. Reach it remotely with Tailscale
      # (`tailscale serve --bg 8787`) or an authenticated reverse proxy, never by opening this port.
      - "127.0.0.1:8787:8787"
    volumes:
      - sable-data:/data
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Scripts run in the sandbox container below (remove these two lines to run them in this container instead).
      SABLE_RUNNER_URL: http://runner:8790
      SABLE_RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # SABLE_MODEL: qwen3:8b
      # TZ: Europe/Lisbon               (schedules use the server's time zone)
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ollama

  # Remove this service if Ollama already runs on the host
  # (then set OLLAMA_HOST to http://host.docker.internal:11434).
  # Sandbox for the agent's scripts: sees only the workspace (chat folders), never Sable's database or keys.
  # Needs Docker Engine 26+ / Compose 2.30+ for volume subpath.
  runner:
    build: ./runner
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      TZ: ${TZ:-UTC}
    volumes:
      - type: volume
        source: sable-data
        target: /workspace
        volume:
          subpath: workspace
    tmpfs:
      - /tmp:size=512m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  sable-data:
  ollama:
